<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 100" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="footer">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
  </defs>

  <!-- Opaque base plate: without this the area between the wave's lower edge
       and y=40 was transparent, so the page background showed through the
       footer (a white wedge on GitHub's light theme). -->
  <rect width="1500" height="100" fill="#0D1117"/>

  <!-- Wave, drawn on top of the base plate -->
  <path d="M0,0 L0,40 C250,80 500,0 750,30 C1000,60 1250,10 1500,40 L1500,0 Z"
        fill="url(#footerGrad)"/>
</svg>
